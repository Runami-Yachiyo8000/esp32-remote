<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c1323">
  <title>ESP32 Robot | 遙控中心</title>
  <style>
    :root { color-scheme: dark; --bg:#0c1323; --surface:#17243b; --surface2:#20314e; --text:#edf4ff; --muted:#9fb2cf; --accent:#53d8c6; --danger:#ff6978; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; min-height:100%; font-family:-apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background:var(--bg); color:var(--text); }
    body { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    main { max-width:510px; margin:0 auto; }
    .eyebrow { font-size:12px; letter-spacing:.22em; font-weight:800; color:var(--accent); margin: 8px 0; }
    h1 {font-size:29px; margin:0 0 6px; letter-spacing:.01em;}
    .sub { font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 17px; }
    .panel { background:var(--surface); border:1px solid #263a5c; border-radius:20px; padding:16px; margin-bottom:15px; box-shadow:0 6px 24px #0002; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .status { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
    .dot { width:10px; height:10px; border-radius:50%; background:#78869c; box-shadow:0 0 0 4px #77859c22; }
    .dot.on { background:var(--accent); box-shadow:0 0 0 4px #53d8c622; }
    button { font:inherit; border:0; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .connect { background:var(--accent); color:#072522; font-weight:800; padding:13px 20px; border-radius:12px; white-space:nowrap; }
    .connect:disabled { opacity:.6; cursor:wait; }
    .label { font-weight:750; font-size:15px; margin-bottom:12px; }
    .info { color:var(--muted); font-size:12px; line-height:1.5; margin-top:8px; }
    .speed { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
    .speed button { height:46px; border-radius:11px; background:var(--surface2); color:var(--text); font-weight:800; border:1px solid #324566; }
    .speed button.selected { background:#164b4a; color:#9cfaf0; border:2px solid var(--accent); }
    .pad { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); grid-template-rows:repeat(3,72px); gap:10px; touch-action:none; }
    .drive { color:var(--text); background:#283d61; border:1px solid #45618b; border-radius:18px; font-size:31px; font-weight:900; touch-action:none; -webkit-touch-callout:none; overscroll-behavior:contain; }
    .drive:active, .drive.held { background:var(--accent); border-color:var(--accent); color:#0b2e30; transform:scale(.98); }
    .stop { background:#65303d; color:#fff; border:1px solid #ae5260; font-size:15px; font-weight:800; border-radius:18px; touch-action:none; }
    .stop:active { background:var(--danger); }
    .empty { pointer-events:none; }
    .utility { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px; }
    .utility button { min-height:49px; border-radius:13px; background:var(--surface2); border:1px solid #324566; color:var(--text); font-size:13px; font-weight:750; }
    .utility button.held { background:var(--accent); color:#07332d; }
    .message { min-height:24px; font-size:12px; color:var(--muted); overflow-wrap:anywhere; line-height:1.6; }
    .warning {color:#f9cd82;}
    footer { font-size:11px; color:#8ca0bf; text-align:center; line-height:1.6; }
    @media (max-height:690px) { .pad { grid-template-rows:repeat(3,59px); } .panel { margin-bottom:10px; padding:12px; } h1{font-size:25px;} }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">ROBOT CONTROL SYSTEM / V2.0 BETA</div>
  <h1>ESP32 遙控中心</h1>
  <p class="sub">按住方向鍵才會行駛；放開立即送出停止指令。ESP32 另有 700 ms 指令逾時保護。</p>

  <section class="panel">
    <div class="row">
      <div class="status"><span id="dot" class="dot"></span><span id="connection">尚未連線</span></div>
      <button id="connect" class="connect" type="button">連接遙控車</button>
    </div>
    <div id="message" class="message" aria-live="polite">請在 iPhone 的 Bluefy 中開啟本 HTTPS 網頁。</div>
  </section>

  <section class="panel">
    <div class="label">速度檔位 <span id="speedText" style="color:var(--accent)">1 / 5</span></div>
    <div class="speed" id="speed">
      <button type="button" data-speed="1" class="selected">1</button>
      <button type="button" data-speed="2">2</button>
      <button type="button" data-speed="3">3</button>
      <button type="button" data-speed="4">4</button>
      <button type="button" data-speed="5">5</button>
    </div>
    <div class="info">初次測試請使用 1 檔、先架空輪子。檔位是 PWM 指令，不是實際車速。</div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:12px"><div class="label" style="margin:0">方向控制</div><span id="driveStatus" style="font-size:12px;color:var(--accent)">待命</span></div>
    <div class="pad" id="pad">
      <div class="empty"></div><button type="button" data-drive="F" class="drive" aria-label="前進">↑</button><div class="empty"></div>
      <button type="button" data-drive="L" class="drive" aria-label="左轉">←</button>
      <button type="button" id="stop" class="stop">停止 STOP</button>
      <button type="button" data-drive="R" class="drive" aria-label="右轉">→</button>
      <div class="empty"></div><button type="button" data-drive="B" class="drive" aria-label="後退">↓</button><div class="empty"></div>
    </div>
    <div class="utility">
      <button type="button" data-drive="X" class="drive" style="font-size:14px">⟲ 左旋</button>
      <button type="button" id="light">💡 開燈</button>
      <button type="button" data-drive="Y" class="drive" style="font-size:14px">右旋 ⟳</button>
    </div>
    <p class="info">切到其他 App、關閉畫面或藍牙失聯時，安全逾時機制會要求停車。請勿將此介面當成唯一的實體安全開關。</p>
  </section>
  <footer>ESP32 BLE 遙控車｜校園專題測試版｜只在確認供電安全後進行實車測試</footer>
</main>
<script>
(() => {
  'use strict';
  const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
  const REPEAT_MS = 170;
  const $ = id => document.getElementById(id);
  let device = null;
  let characteristic = null;
  let sending = false;
  let pending = null;
  let heldPointer = null;
  let heldButton = null;
  let heldCommand = null;
  let heartbeat = null;
  let selectedSpeed = 1;
  let lampOn = false;

  function message(text, warn = false) {
    $('message').textContent = text;
    $('message').className = warn ? 'message warning' : 'message';
  }
  function connectedUI(value) {
    $('dot').classList.toggle('on', value);
    $('connection').textContent = value ? '已連線：ESP32_Robot' : '尚未連線';
    $('connect').textContent = value ? '重新連線' : '連接遙控車';
  }
  function enqueue(cmd) {
    if (!characteristic) return;
    // Latest command wins: stop never waits behind a backlog of movement packets.
    pending = cmd;
    void flush();
  }
  async function flush() {
    if (sending || !characteristic) return;
    sending = true;
    try {
      while (pending !== null && characteristic) {
        const cmd = pending;
        pending = null;
        const characteristicAtStart = characteristic;
        const data = new TextEncoder().encode(cmd);
        if (typeof characteristicAtStart.writeValueWithResponse === 'function') {
          await characteristicAtStart.writeValueWithResponse(data);
        } else {
          await characteristicAtStart.writeValue(data);
        }
      }
    } catch (err) {
      message('藍牙傳送失敗：' + (err?.message || err) + '。ESP32 逾時保護將停車。', true);
      stopHolding(false);
      pending = null;
      characteristic = null;
      connectedUI(false);
    } finally {
      sending = false;
      if (pending !== null && characteristic) void flush();
    }
  }
  function stopHolding(sendStop = true) {
    if (heartbeat !== null) { clearInterval(heartbeat); heartbeat = null; }
    if (heldButton) heldButton.classList.remove('held');
    heldButton = null;
    heldPointer = null;
    heldCommand = null;
    $('driveStatus').textContent = '待命';
    if (sendStop) enqueue('S');
  }
  function startHolding(button, event) {
    event.preventDefault();
    if (!characteristic) { message('請先連接 ESP32_Robot。', true); return; }
    if (heldPointer !== null) return;
    heldPointer = event.pointerId;
    heldButton = button;
    heldCommand = button.dataset.drive;
    button.classList.add('held');
    $('driveStatus').textContent = '行駛中：' + heldCommand;
    if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
    enqueue(heldCommand);
    heartbeat = setInterval(() => {
      if (heldCommand && document.visibilityState !== 'hidden') enqueue(heldCommand);
    }, REPEAT_MS);
  }
  for (const button of document.querySelectorAll('[data-drive]')) {
    button.addEventListener('pointerdown', event => startHolding(button, event));
    button.addEventListener('pointerup', event => {
      if (heldPointer === event.pointerId) stopHolding();
    });
    button.addEventListener('pointercancel', event => {
      if (heldPointer === event.pointerId) stopHolding();
    });
    button.addEventListener('pointermove', event => {
      if (heldPointer !== event.pointerId) return;
      const box = button.getBoundingClientRect();
      if (event.clientX < box.left || event.clientX > box.right ||
          event.clientY < box.top || event.clientY > box.bottom) stopHolding();
    });
    button.addEventListener('lostpointercapture', event => {
      if (heldPointer === event.pointerId) stopHolding();
    });
    button.addEventListener('contextmenu', event => event.preventDefault());
  }
  window.addEventListener('pointerup', event => {
    if (heldPointer === event.pointerId) stopHolding();
  });
  window.addEventListener('pointercancel', event => {
    if (heldPointer === event.pointerId) stopHolding();
  });
  $('stop').addEventListener('pointerdown', event => { event.preventDefault(); stopHolding(); });
  document.getElementById('speed').addEventListener('click', event => {
    const button = event.target.closest('[data-speed]');
    if (!button) return;
    selectedSpeed = Number(button.dataset.speed);
    document.querySelectorAll('[data-speed]').forEach(item => {
      item.classList.toggle('selected', Number(item.dataset.speed) === selectedSpeed);
    });
    $('speedText').textContent = selectedSpeed + ' / 5';
    enqueue(String(selectedSpeed));
  });
  $('light').addEventListener('click', () => {
    lampOn = !lampOn;
    $('light').textContent = lampOn ? '💡 關燈' : '💡 開燈';
    enqueue(lampOn ? 'W' : 'w');
  });
  function disconnected() {
    stopHolding(false);
    pending = null;
    characteristic = null;
    connectedUI(false);
    message('BLE 已斷線。車子應由 ESP32 自動停止。', true);
  }
  $('connect').addEventListener('click', async () => {
    if (!navigator.bluetooth) {
      message('瀏覽器不支援 Web Bluetooth。請用 iPhone 的 Bluefy 開啟 HTTPS 網址。', true);
      return;
    }
    stopHolding();
    $('connect').disabled = true;
    message('正在搜尋 ESP32_Robot…');
    try {
      if (device?.gatt?.connected) device.gatt.disconnect();
      characteristic = null;
      device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'ESP32_Robot' }],
        optionalServices: [SERVICE_UUID]
      });
      device.addEventListener('gattserverdisconnected', disconnected);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
      connectedUI(true);
      message('連線成功。放開按鍵即停止，請先測試 1 檔。');
      enqueue('S');
      enqueue(String(selectedSpeed));
    } catch (err) {
      characteristic = null;
      connectedUI(false);
      message('連線失敗：' + (err?.message || err), true);
    } finally {
      $('connect').disabled = false;
    }
  });
  window.addEventListener('blur', () => stopHolding());
  window.addEventListener('pagehide', () => stopHolding());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') stopHolding();
  });
  connectedUI(false);
})();
</script>
</body>
</html>
